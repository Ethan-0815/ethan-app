<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-blur="on" data-perf="high">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="我的空间 —— 离线个人物品与生活资料档案库">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
  /* ETHAN Super App：首绘前应用统一主题，避免闪白（正式应用由本模块 prefs 引擎接管） */
  try {
    var __esaPref = 'system';
    try { __esaPref = localStorage.getItem('esa.theme') || 'system'; } catch (e2) {}
    var __esaDark = __esaPref === 'dark' || (__esaPref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = __esaDark ? 'dark' : 'light';
    var __esaMeta = document.querySelector('meta[name="theme-color"]');
    if (__esaMeta) __esaMeta.setAttribute('content', __esaDark ? '#0f1113' : '#f7f8fa');
  } catch (e) {}
  </script>
  <title>我的空间</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236b8bc9'/%3E%3Cpath d='M5 9.4 12 5.5l7 3.9v5.2L12 18.5 5 14.6z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M5 9.4 12 13.3l7-3.9' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="esa-glass.css">
</head>

        <path d="M4 8.2 12 12.4l8-4.2"></path>
        <path d="M12 12.4V20"></path>
