<!DOCTYPE html>
<html lang="zh-CN" data-glass="blur">
<head>
<meta charset="utf-8">
<title>旅行足迹</title>

<!-- Mobile-first viewport. viewport-fit=cover is required for env(safe-area-*)
     to report real values inside the notch / home-indicator region. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="旅行足迹 — 离线记录你去过的城市、每一次旅行、照片与附件。">

<!-- Pre-paint theme guard: sets data-theme before anything renders so the
     saved (or system) dark mode never flashes white first. -->
<script>
(function(){try{
var t=null;
try{t=localStorage.getItem('esa.theme')||localStorage.getItem('tf-theme');}catch(e2){}
if(t==='dark'||(t!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)){
document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();
</script>

<!-- No external resources by design: no CDN, no fonts, no analytics, no ads.
     Everything the app needs ships in this folder. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d6ea6'/%3E%3Cpath d='M16 7l2.6 5.9L25 16l-6.4 3.1L16 25l-2.6-5.9L7 16l6.4-3.1z' fill='%23fff'/%3E%3C/svg%3E">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="esa-glass.css">
</head>

<body>
<div id="app">
  <!-- Pages mount here as absolutely-positioned .screen nodes. -->
  <div id="viewport"></div>

  <!-- Floating glass tab bar lives outside #viewport so it is never clipped
       or scrolled by a page. -->
  <div id="nav-root"></div>
</div>

<!-- Overlays (sheets, dialogs, image viewer) escape the app shell so they can
     cover the nav bar too. -->
<div id="overlay-root"></div>
<div id="toast-root" aria-live="polite" aria-atomic="true"></div>

<noscript>
  <div style="padding:24px;font-family:system-ui,sans-serif">
    旅行足迹需要启用 JavaScript 才能运行。
  </div>
</noscript>

<!-- ==========================================================================
     Load order is a hard dependency chain (IIFE + one global namespace, no
     bundler). Rule: a file may only use namespaces declared ABOVE it.

       core     →  pure logic, no DOM
       data     →  storage adapters/repo, depends on core
       assets   →  offline data (cities, world outline)
       platform →  image pipeline + native bridge
       ui       →  dom → parts → nav/router → map → pages → flows
       app      →  boot (must be LAST)

     No `type="module"`: ES modules fail under file:// (CORS) and inside the
     Android WebView's file:///android_asset/ origin.
     ========================================================================== -->

<!-- core -->
<script src="js/core/util.js"></script>
<script src="js/core/model.js"></script>
<script src="js/core/zip.js"></script>
<script src="js/core/backup.js"></script>

<!-- data -->
<script src="js/data/adapter.js"></script>
<script src="js/data/idb.js"></script>
<script src="js/data/repo.js"></script>

<!-- offline assets -->
<script src="assets/geo/cities.js"></script>
<script src="assets/geo/world.js"></script>

<!-- platform -->
<script src="js/platform/image.js"></script>
<script src="js/platform/native.js"></script>

<!-- ui -->
<script src="js/ui/dom.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/ui/parts.js"></script>
<script src="js/ui/map.js"></script>
<script src="js/ui/nav.js"></script>
<script src="js/ui/router.js"></script>
<script src="js/ui/pages/home.js"></script>
<script src="js/ui/pages/map.js"></script>
<script src="js/ui/pages/timeline.js"></script>
<script src="js/ui/pages/cities.js"></script>
<script src="js/ui/pages/city.js"></script>
<script src="js/ui/flows.js"></script>

<!-- boot -->
<script src="js/app.js"></script>
<!-- ETHAN Super App 模块桥（整合层新增） -->
<script src="esa.js"></script>
</body>
</html>
