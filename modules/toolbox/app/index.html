<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-blur="on" data-perf="high">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="color-scheme" content="light dark">
  <script>
  /* ETHAN Super App：首绘前应用统一主题，避免闪白 */
  try {
    var __esaPref = 'light';
    try { __esaPref = localStorage.getItem('esa.theme') || 'light'; } catch (e2) {}
    var __esaDark = __esaPref === 'dark' || (__esaPref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = __esaDark ? 'dark' : 'light';
    var __esaMeta = document.querySelector('meta[name="theme-color"]');
    if (__esaMeta) __esaMeta.setAttribute('content', __esaDark ? '#15171b' : '#f5f6f8');
  } catch (e) {}
  </script>
  <meta name="description" content="工具箱 —— 纯离线、本地处理的个人实用工具箱">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>工具箱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f6bff'/%3E%3Cpath d='M4.5 9.5h15v8.2a1.3 1.3 0 0 1-1.3 1.3H5.8a1.3 1.3 0 0 1-1.3-1.3z' fill='none' stroke='white' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M9.2 9.5V7.2A1.2 1.2 0 0 1 10.4 6h3.2a1.2 1.2 0 0 1 1.2 1.2v2.3' fill='none' stroke='white' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M4.5 13.4h15' fill='none' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="esa-glass.css">
</head>
<body>

  <!-- 启动页：本地资源秒开，正常情况下几乎看不到 -->
  <div id="boot">
    <div class="boot__logo">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 9.5h15v8.2a1.3 1.3 0 0 1-1.3 1.3H5.8a1.3 1.3 0 0 1-1.3-1.3z"></path>
        <path d="M9.2 9.5V7.2A1.2 1.2 0 0 1 10.4 6h3.2a1.2 1.2 0 0 1 1.2 1.2v2.3"></path>
        <path d="M4.5 13.4h15"></path>
      </svg>
    </div>
    <div class="boot__name">工具箱</div>
    <div class="boot__text">正在准备本地工具…</div>
  </div>

  <div id="app" class="app">
    <div id="screens" class="screens"></div>
  </div>

  <!-- 核心层：纯逻辑，零 DOM，可独立单元测试 -->
  <script src="js/core/util.js"></script>
  <script src="js/core/calculator.js"></script>
  <script src="js/core/units.js"></script>
  <script src="js/core/numbers.js"></script>
  <script src="js/core/jsonutil.js"></script>
  <script src="js/core/radix.js"></script>
  <script src="js/core/timestamp.js"></script>
  <script src="js/core/registry.js"></script>

  <!-- 平台能力层 -->
  <script src="js/platform/pdf.js"></script>
  <script src="js/platform/imaging.js"></script>
  <script src="js/platform/files.js"></script>
  <script src="js/platform/recent.js"></script>

  <!-- UI 层 -->
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/frame.js"></script>
  <script src="js/ui/router.js"></script>

  <!-- 工具页面（每个工具一个文件，互相独立） -->
  <script src="js/ui/pages/home.js"></script>
  <script src="js/ui/pages/img-compress.js"></script>
  <script src="js/ui/pages/img-convert.js"></script>
  <script src="js/ui/pages/img-pdf.js"></script>
  <script src="js/ui/pages/calc.js"></script>
  <script src="js/ui/pages/discount.js"></script>
  <script src="js/ui/pages/percent.js"></script>
  <script src="js/ui/pages/units.js"></script>
  <script src="js/ui/pages/filesize.js"></script>
  <script src="js/ui/pages/random.js"></script>
  <script src="js/ui/pages/json.js"></script>
  <script src="js/ui/pages/radix.js"></script>
  <script src="js/ui/pages/uuid.js"></script>
  <script src="js/ui/pages/timestamp.js"></script>

  <!-- 引导 -->
  <script src="js/app.js"></script>
  <!-- ETHAN Super App 模块桥（整合层新增） -->
  <script src="esa.js"></script>
</body>
</html>
